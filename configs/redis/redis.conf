# Thor Firewall — Redis Configuration
# ─────────────────────────────────────────────────────────────────────────────

bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 60
maxmemory 1gb
maxmemory-policy allkeys-lru

# Persistence
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Performance
hz 100
dynamic-hz yes
aof-use-rdb-preamble yes
activerehashing yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Logging
loglevel notice

# Thor-specific key prefixes:
# thor:flow:<hash>    → flow verdict (TTL 60s)
# thor:blacklist:*    → known bad IPs (TTL 24h)
# thor:intel:*        → threat intel cache (TTL 1h)
# thor:session:*      → JWT sessions (TTL 5min)
# thor:ueba:*         → UEBA baselines (TTL 24h)
