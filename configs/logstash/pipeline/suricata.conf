input {
  file {
    path            => "/var/log/suricata/eve.json"
    codec           => json
    tags            => ["suricata"]
    sincedb_path    => "/usr/share/logstash/data/.sincedb_suricata"
    start_position  => "beginning"
  }
}
filter {
  if "suricata" in [tags] {
    date {
      match    => ["timestamp", "ISO8601"]
      target   => "@timestamp"
      timezone => "UTC"
    }
    mutate { add_field => { "thor_source" => "suricata" } }
    if [event_type] == "alert" {
      mutate {
        add_field => { "[@metadata][es_index]" => "suricata-alerts-%{+YYYY.MM.dd}" }
        add_tag   => ["suricata_alert"]
      }
    } else {
      mutate { add_field => { "[@metadata][es_index]" => "suricata-events-%{+YYYY.MM.dd}" } }
    }
  }
}
output {
  if "suricata" in [tags] {
    elasticsearch {
      hosts    => ["http://elasticsearch:9200"]
      user     => "elastic"
      password => "${ELASTIC_PASSWORD}"
      index    => "%{[@metadata][es_index]}"
    }
    if "suricata_alert" in [tags] {
      http {
        url          => "http://thehive:9000/api/v1/alert"
        http_method  => "post"
        content_type => "application/json"
        headers      => { "Authorization" => "Bearer ${THEHIVE_API_KEY}" }
        format       => "json"
        mapping      => {
          "type"        => "suricata"
          "source"      => "suricata-nids"
          "sourceRef"   => "%{[flow_id]}"
          "title"       => "Suricata: %{[alert][signature]}"
          "severity"    => 2
          "tags"        => ["suricata","nids","%{[alert][category]}"]
          "description" => "Sig: %{[alert][signature]}\nSrc: %{[src_ip]}:%{[src_port]}\nDst: %{[dest_ip]}:%{[dest_port]}\nProto: %{[proto]}"
        }
      }
    }
  }
}
