apiVersion: v2
name: thor-firewall
description: Thor Firewall — Enterprise Security Platform (eBPF + ML + K8s)
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - security
  - firewall
  - ebpf
  - ml
  - siem
maintainers:
  - name: Thor Security Team
    url: https://github.com/mhmsdfhwhegggggggg/Thor-Firewall
dependencies:
  - name: clickhouse
    version: "~6.x"
    repository: https://charts.bitnami.com/bitnami
    condition: clickhouse.enabled
  - name: redis
    version: "~20.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: prometheus
    version: "~25.x"
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.prometheus.enabled
  - name: grafana
    version: "~8.x"
    repository: https://grafana.github.io/helm-charts
    condition: monitoring.grafana.enabled
