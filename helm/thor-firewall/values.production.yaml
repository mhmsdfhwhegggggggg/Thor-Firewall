# Thor Firewall — Production Overrides
# استخدم: helm upgrade thor ./thor-firewall -f values.yaml -f values.production.yaml

global:
  imageTag: "1.0.0"

controlPlane:
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "4"
      memory: "4Gi"

mlInference:
  replicas: 2
  gpu:
    enabled: true
    count: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "8"
      memory: "16Gi"

clickhouse:
  replicaCount: 3
  shards: 2
  persistence:
    size: 2Ti

redis:
  architecture: replication
  replica:
    replicaCount: 3

monitoring:
  prometheus:
    retention: "90d"
    storage:
      size: 200Gi
