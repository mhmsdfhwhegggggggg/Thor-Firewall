[package]
name = "thor-agent"
version = "1.0.0"
edition = "2021"
authors = ["Thor Security Team"]
description = "Thor Firewall eBPF/XDP Network Agent"
license = "MIT"

[[bin]]
name = "thor-agent"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.21", features = ["auto-initialize"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
metrics = "0.22"
metrics-exporter-prometheus = "0.13"
uuid = { version = "1", features = ["v4"] }
tokio-util = "0.7"
bytes = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
