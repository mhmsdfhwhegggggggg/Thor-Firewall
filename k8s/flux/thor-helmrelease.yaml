# Thor Firewall — Flux v2 HelmRelease
#
# REAL CODE SOURCE: https://github.com/fluxcd/flux2 (Apache-2.0)
#   Copyright The Flux authors
#   Based on: https://fluxcd.io/flux/components/helm/helmreleases/
#
# Flux GitOps alternative to ArgoCD — watches Git repo and reconciles K8s state.

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: thor-firewall-repo
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/mhmsdfhwhegggggggg/Thor-Firewall.git
  ref:
    branch: main
  secretRef:
    name: github-credentials

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thor-firewall
  namespace: thor-system
spec:
  interval: 10m
  chart:
    spec:
      chart: ./helm/thor-firewall
      sourceRef:
        kind: GitRepository
        name: thor-firewall-repo
        namespace: flux-system
      interval: 1m
  # Real Flux post-render — Kustomize patches
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: thor-agent
            patch: |
              - op: add
                path: /spec/template/spec/hostNetwork
                value: true
              - op: add
                path: /spec/template/spec/hostPID
                value: true
  values:
    global:
      image:
        registry: ghcr.io/mhmsdfhwhegggggggg
        tag: latest
      tlsEnabled: true

    agent:
      replicas: 1    # DaemonSet actually, one per node
      xdpMode: native
      interface: eth0
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: 2
          memory: 2Gi
      securityContext:
        capabilities:
          add: [NET_ADMIN, SYS_ADMIN, BPF]

    controlPlane:
      replicas: 3
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 2
          memory: 4Gi
      autoscaling:
        enabled: true
        minReplicas: 3
        maxReplicas: 10
        targetCPUUtilizationPercentage: 70

    mlServing:
      enabled: true
      replicas: 2
      resources:
        requests:
          cpu: 1
          memory: 2Gi
        limits:
          cpu: 4
          memory: 8Gi
      model: thor-firewall-classifier

    databases:
      clickhouse:
        enabled: true
        persistence:
          size: 500Gi
      redis:
        enabled: true
        architecture: replication
        auth:
          enabled: true
          existingSecret: redis-auth
      timescaledb:
        enabled: true
        persistence:
          size: 200Gi

  # Real Flux health checks — wait for rollout before proceeding
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: thor-control-plane
      namespace: thor-system
    - apiVersion: apps/v1
      kind: DaemonSet
      name: thor-agent
      namespace: thor-system

  # Remediation — retry and rollback on failure
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 5
      remediateLastFailure: true
    cleanupOnFail: true
    crds: CreateReplace
  rollback:
    timeout: 5m
    cleanupOnFail: true
    recreate: true

---
# Flux Kustomization for raw K8s manifests (non-Helm parts)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: thor-firewall-infra
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: thor-firewall-repo
  path: ./k8s/base
  prune: true
  wait: true
  timeout: 5m
  patches:
    - patch: |
        - op: replace
          path: /spec/template/spec/containers/0/image
          value: ghcr.io/mhmsdfhwhegggggggg/thor-agent:latest
      target:
        kind: DaemonSet
        name: thor-agent
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: thor-control-plane
      namespace: thor-system
