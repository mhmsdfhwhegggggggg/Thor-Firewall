apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: thor-firewall
  labels:
    app: control-plane
spec:
  selector:
    app: control-plane
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: metrics
      port: 9091
      targetPort: 9091
---
apiVersion: v1
kind: Service
metadata:
  name: ml-serving
  namespace: thor-firewall
spec:
  selector:
    app: ml-serving
  ports:
    - name: http
      port: 8001
      targetPort: 8001
    - name: metrics
      port: 9092
      targetPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: thor-firewall
spec:
  selector:
    app: dashboard
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: thor-firewall
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: thor-firewall
spec:
  selector:
    app: clickhouse
  clusterIP: None
  ports:
    - name: http
      port: 8123
    - name: native
      port: 9000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: thor-ingress
  namespace: thor-firewall
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - thor.example.com
      secretName: thor-tls
  rules:
    - host: thor.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: control-plane
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 80
