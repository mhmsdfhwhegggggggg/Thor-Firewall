apiVersion: v1
kind: ServiceAccount
metadata:
  name: thor-control-plane
  namespace: thor-firewall
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thor-ml
  namespace: thor-firewall
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: thor-control-plane
  namespace: thor-firewall
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: thor-control-plane
  namespace: thor-firewall
subjects:
  - kind: ServiceAccount
    name: thor-control-plane
    namespace: thor-firewall
roleRef:
  kind: Role
  name: thor-control-plane
  apiGroup: rbac.authorization.k8s.io
