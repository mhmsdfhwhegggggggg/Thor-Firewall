# Thor Firewall — mTLS between services (Istio OR manual cert)
# يُؤمِّن الاتصال بين: agent → control-plane → ml-inference

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thor-internal-ca
  namespace: thor-production
spec:
  isCA: true
  secretName: thor-internal-ca-secret
  commonName: thor-internal-ca
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}

---
# Agent mTLS certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thor-agent-cert
  namespace: thor-production
spec:
  secretName: thor-agent-mtls-secret
  issuerRef:
    name: thor-internal-ca
    kind: ClusterIssuer
  commonName: thor-agent
  dnsNames:
    - thor-agent.thor-production.svc.cluster.local
  usages:
    - client auth
    - digital signature
    - key encipherment
