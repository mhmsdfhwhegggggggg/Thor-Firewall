# Thor Firewall — cert-manager ClusterIssuers
# Let's Encrypt for production TLS certificates
# Prerequisites: cert-manager installed (helm install cert-manager jetstack/cert-manager --set installCRDs=true)

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  namespace: cert-manager
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: security@yourdomain.com   # ← غيّر هذا
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx
        selector:
          dnsNames:
            - thor.yourdomain.com       # ← غيّر هذا
            - api.thor.yourdomain.com

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging           # للاختبار بدون rate limits
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: security@yourdomain.com
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
# Certificate for Thor dashboard + API
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thor-tls
  namespace: thor-production
spec:
  secretName: thor-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - thor.yourdomain.com
    - api.thor.yourdomain.com
  duration: 2160h      # 90 days
  renewBefore: 360h    # 15 days before expiry
