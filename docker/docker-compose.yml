version: "3.9"

# Thor Firewall — Full Stack Docker Compose
# التشغيل: docker compose up -d

name: thor-firewall

services:
  # ──────────────────────────────────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────────────────────────────────

  redis:
    image: redis:7.2-alpine
    container_name: thor-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.5-alpine
    container_name: thor-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"   # HTTP
      - "127.0.0.1:9000:9000"   # Native
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./configs/clickhouse:/etc/clickhouse-server/config.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────────────────
  # Thor Components
  # ──────────────────────────────────────────────────────────────────────────

  control-plane:
    build:
      context: ..
      dockerfile: docker/Dockerfile.control-plane
    container_name: thor-control-plane
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      THOR_REDIS_URL: "redis://redis:6379/0"
      THOR_CLICKHOUSE_URL: "clickhouse://clickhouse:9000/thor"
      THOR_LLM_SERVER_URL: "http://llm-server:8081"
      THOR_LOG_LEVEL: "info"
      THOR_SECRET_KEY: "${THOR_SECRET_KEY:-change-me-in-production}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: thor-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: "http://localhost:8080"
      VITE_WS_URL: "ws://localhost:8080/ws/live"
    depends_on:
      - control-plane

  # ──────────────────────────────────────────────────────────────────────────
  # LLM Server (Optional — resource intensive)
  # ──────────────────────────────────────────────────────────────────────────

  llm-server:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: thor-llm
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - llm-models:/models
    command: >
      --model /models/mistral-7b-security.gguf
      --host 0.0.0.0
      --port 8080
      --n-gpu-layers 35
      --ctx-size 4096
      --threads 8
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - llm  # Only start with: docker compose --profile llm up

  # ──────────────────────────────────────────────────────────────────────────
  # Monitoring
  # ──────────────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: thor-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:10.4.3
    container_name: thor-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
    profiles:
      - monitoring

volumes:
  redis-data:
  clickhouse-data:
  llm-models:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: thor-network
    driver: bridge
