# Thor Firewall — Docker Compose (Full Integration Stack)
# ─────────────────────────────────────────────────────────────────────────────
# يضم: ClickHouse + Redis + TimescaleDB + MLflow + Keycloak
#       Loki + Jaeger + Prometheus + Grafana + MISP + BentoML + vLLM
# الاستخدام: make dev  أو  docker compose up -d
# الاستخدام مع LLM: docker compose --profile inference up -d
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

networks:
  thor-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
  thor-ml-net:
    driver: bridge
  thor-obs-net:
    driver: bridge

volumes:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
  tempo_data:
  opencti_data:
  opencti_es_data:
  minio_data:
  rabbitmq_data:
  thehive_data:
  thehive_db_data:
  wazuh_data:
  wazuh_logs:
  wazuh_queue:
  clickhouse_data:
  redis_data:
  timescaledb_data:
  mlflow_data:
  ml_models:
  grafana_data:
  prometheus_data:
  loki_data:
  jaeger_data:
  keycloak_data:
  misp_data:
  misp_mysql_data:
  bentoml_models:

services:

# ─────────────────────────────────────────────────────────────────────────────
# DATABASES — ClickHouse + Redis + TimescaleDB
# ─────────────────────────────────────────────────────────────────────────────

  # ── ClickHouse (Flow Storage + Analytics — مستوحى من Cilium Hubble) ─────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: thor-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"    # HTTP
      - "9000:9000"    # Native
      - "9363:9363"    # Prometheus metrics
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./configs/clickhouse:/docker-entrypoint-initdb.d
    environment:
      CLICKHOUSE_DB: thor
      CLICKHOUSE_USER: thor
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-thor_dev_password}"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - thor-net

  # ── Redis (State + Cache + Pub/Sub — BPF map sync + flow table TTL) ─────────
  redis:
    image: redis:7.2-alpine
    container_name: thor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --hz 100
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - thor-net

  # ── Redis Exporter ───────────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: thor-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - thor-net
      - thor-obs-net

  # ── TimescaleDB (Time-Series Metrics — Agent + System performance data) ──────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: thor-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./configs/timescaledb/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    environment:
      POSTGRES_DB: thor_metrics
      POSTGRES_USER: thor
      POSTGRES_PASSWORD: "${TIMESCALEDB_PASSWORD:-thor_ts_dev_password}"
      TIMESCALEDB_TELEMETRY: "off"
    command: postgres -c shared_preload_libraries=timescaledb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "thor", "-d", "thor_metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - thor-net

# ─────────────────────────────────────────────────────────────────────────────
# AUTH & IDENTITY — Keycloak (JWT/OIDC/SAML) + Casbin (RBAC)
# ─────────────────────────────────────────────────────────────────────────────

  keycloak-db:
    image: postgres:16-alpine
    container_name: thor-keycloak-db
    restart: unless-stopped
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: "${KEYCLOAK_DB_PASSWORD:-keycloak_dev_pass}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - thor-net

  # ── Keycloak (IAM — JWT, OIDC, SAML, MFA) ──────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: thor-keycloak
    restart: unless-stopped
    ports:
      - "8180:8080"
    volumes:
      - ./configs/keycloak/thor-realm.json:/opt/keycloak/data/import/thor-realm.json:ro
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://keycloak-db:5432/keycloak"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:-keycloak_dev_pass}"
      KC_HOSTNAME: "${KEYCLOAK_HOSTNAME:-localhost}"
      KC_HOSTNAME_PORT: "8180"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-Admin2024!}"
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    command: start-dev --import-realm
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - thor-net

# ─────────────────────────────────────────────────────────────────────────────
# ML PLATFORM — MLflow + BentoML + Ray + vLLM
# ─────────────────────────────────────────────────────────────────────────────

  # ── MLflow (Experiment Tracking + Model Registry) ────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:2.13.0
    container_name: thor-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
      - ml_models:/models
    environment:
      MLFLOW_BACKEND_STORE_URI: "sqlite:////mlflow/mlflow.db"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: "file:///mlflow/artifacts"
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
      --workers 4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - thor-net
      - thor-ml-net

  # ── BentoML (Model Serving — MARL + GNN + UEBA inference) ──────────────────
  bentoml:
    build:
      context: ./ml
      dockerfile: Dockerfile.bentoml
    container_name: thor-bentoml
    restart: unless-stopped
    ports:
      - "3000:3000"    # HTTP REST
      - "50055:50051"  # gRPC (Tonic client connects here)
    volumes:
      - bentoml_models:/home/bentoml/bentoml/bentos
      - ml_models:/models:ro
    environment:
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      BENTOML_PORT: "3000"
      MODEL_PATH: "/models"
      REDIS_URL: "redis://redis:6379/1"
      DEVICE: "${ML_DEVICE:-cpu}"
    depends_on:
      mlflow:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - thor-net
      - thor-ml-net

  # ── vLLM (LLM Inference — Mistral-7B Explainer — GPU optional) ──────────────
  vllm:
    image: vllm/vllm-openai:latest
    container_name: thor-vllm
    restart: unless-stopped
    profiles: ["inference"]
    ports:
      - "8001:8000"
    volumes:
      - ml_models:/models
    environment:
      MODEL: "${VLLM_MODEL:-mistralai/Mistral-7B-Instruct-v0.2}"
    command: >
      python -m vllm.entrypoints.openai.api_server
      --model ${VLLM_MODEL:-mistralai/Mistral-7B-Instruct-v0.2}
      --host 0.0.0.0
      --port 8000
      --max-model-len 8192
      --quantization ${VLLM_QUANTIZATION:-awq}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    networks:
      - thor-ml-net

  # ── ML Inference (Core — CPU MARL/GNN serving) ───────────────────────────────
  ml-inference:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: thor-ml-inference
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - ml_models:/models
    environment:
      MODEL_PATH: /models/thor_marl_best.pt
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DEVICE: "${ML_DEVICE:-cpu}"
      BATCH_SIZE: "${ML_BATCH_SIZE:-256}"
      PORT: "8082"
      BENTOML_URL: "http://bentoml:3000"
      VLLM_URL: "http://vllm:8000/v1"
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - thor-net
      - thor-ml-net

# ─────────────────────────────────────────────────────────────────────────────
# THREAT INTELLIGENCE — MISP (IoC Database)
# ─────────────────────────────────────────────────────────────────────────────

  misp-db:
    image: mariadb:10.11
    container_name: thor-misp-db
    restart: unless-stopped
    volumes:
      - misp_mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MISP_DB_ROOT_PASSWORD:-misp_root_dev}"
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: "${MISP_DB_PASSWORD:-misp_dev_password}"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "root", "-pmisp_root_dev"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - thor-net

  # ── MISP (Malware Information Sharing Platform) ──────────────────────────────
  misp:
    image: ghcr.io/misp/misp-docker/misp-core:latest
    container_name: thor-misp
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "8081:80"
    volumes:
      - misp_data:/var/www/MISP/app/files
    environment:
      MISP_BASEURL: "http://localhost:8081"
      MYSQL_HOST: misp-db
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: "${MISP_DB_PASSWORD:-misp_dev_password}"
      MISP_ADMIN_EMAIL: "${MISP_ADMIN_EMAIL:-admin@thor.local}"
      MISP_ADMIN_PASSWORD: "${MISP_ADMIN_PASSWORD:-MispAdmin2024!}"
      MISP_ORG: "Thor Security"
    depends_on:
      misp-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/users/login"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - thor-net

# ─────────────────────────────────────────────────────────────────────────────
# CORE APP — Control Plane + Dashboard
# ─────────────────────────────────────────────────────────────────────────────

  # ── Control Plane (FastAPI + Casbin RBAC + Sigma + SOAR) ────────────────────
  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    container_name: thor-control-plane
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CLICKHOUSE_URL: "clickhouse://thor:${CLICKHOUSE_PASSWORD:-thor_dev_password}@clickhouse:9000/thor"
      REDIS_URL: "redis://redis:6379/0"
      TIMESCALEDB_URL: "postgresql+asyncpg://thor:${TIMESCALEDB_PASSWORD:-thor_ts_dev_password}@timescaledb:5432/thor_metrics"
      ML_INFERENCE_URL: "http://ml-inference:8082"
      BENTOML_URL: "http://bentoml:3000"
      VLLM_URL: "http://vllm:8000/v1"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MISP_URL: "http://misp:80"
      MISP_AUTH_KEY: "${MISP_AUTH_KEY:-}"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "thor"
      KEYCLOAK_CLIENT_ID: "thor-api"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:-}"
      JWT_SECRET: "${JWT_SECRET:-dev_secret_change_in_prod}"
      AUDIT_HMAC_SECRET: "${AUDIT_HMAC_SECRET:-hmac_dev_change_in_prod_32b!!}"
      SIGMA_RULES_DIR: "/app/configs/sigma"
      CASBIN_MODEL_PATH: "/app/configs/casbin/rbac_model.conf"
      CASBIN_POLICY_PATH: "/app/configs/casbin/rbac_policy.csv"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "thor-control-plane"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
    volumes:
      - ./configs/sigma:/app/configs/sigma:ro
      - ./configs/casbin:/app/configs/casbin:ro
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - thor-net
      - thor-obs-net

  # ── Dashboard (React + Cytoscape.js SOC UI) ──────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    container_name: thor-dashboard
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      - ./dashboard/src:/app/src:ro
    environment:
      VITE_API_URL: "${VITE_API_URL:-http://localhost:8000}"
      VITE_KEYCLOAK_URL: "http://localhost:8180"
      VITE_KEYCLOAK_REALM: "thor"
      VITE_KEYCLOAK_CLIENT_ID: "thor-dashboard"
      VITE_GRAFANA_URL: "http://localhost:3001"
      VITE_JAEGER_URL: "http://localhost:16686"
      PORT: "3000"
    depends_on:
      - control-plane
    networks:
      - thor-net

# ─────────────────────────────────────────────────────────────────────────────
# OBSERVABILITY — Prometheus + Grafana + Loki + Jaeger
# ─────────────────────────────────────────────────────────────────────────────

  # ── Prometheus (Metrics Collection) ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: thor-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus:/etc/prometheus:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
      - "--log.level=warn"
    networks:
      - thor-net
      - thor-obs-net

  # ── Grafana (Visualization — Dashboards + Keycloak SSO + Loki/Jaeger sources) ─
  grafana:
    image: grafana/grafana:11.1.0
    container_name: thor-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning/datasources:ro
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
      GF_AUTH_GENERIC_OAUTH_NAME: "Keycloak"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "http://keycloak:8080/realms/thor/protocol/openid-connect/auth"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "http://keycloak:8080/realms/thor/protocol/openid-connect/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "http://keycloak:8080/realms/thor/protocol/openid-connect/userinfo"
      GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource,grafana-piechart-panel,grafana-worldmap-panel"
      GF_FEATURE_TOGGLES_ENABLE: "traceToMetrics,traceToLogs"
    depends_on:
      - prometheus
      - loki
    networks:
      - thor-obs-net

  # ── Loki (Log Aggregation — structured JSON logs from all services) ──────────
  loki:
    image: grafana/loki:3.1.0
    container_name: thor-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    command: -config.file=/etc/loki/loki-config.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready && echo ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - thor-obs-net

  # ── Promtail (Log Shipper → Loki) ────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.1.0
    container_name: thor-promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - thor-obs-net

  # ── Jaeger (Distributed Tracing — OpenTelemetry OTLP) ───────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: thor-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "14268:14268"  # Jaeger HTTP thrift
    volumes:
      - jaeger_data:/badger
    environment:
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
      COLLECTOR_OTLP_ENABLED: "true"
      LOG_LEVEL: warn
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ | head -1 && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - thor-obs-net
      - thor-net

# ─────────────────────────────────────────────────────────────────────────────
# STREAMING — Apache Kafka + Zookeeper
# Real: https://github.com/apache/kafka
# ─────────────────────────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: thor-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks: [thor-net]
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: thor-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9101:9101"   # JMX metrics
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      # Auto-create Thor topics
      KAFKA_CREATE_TOPICS: "thor.flows:8:1,thor.alerts:4:1,thor.ml.decisions:4:1,thor.threat.intel:2:1"
      # Retention: 48h for flows, 7d for alerts
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [thor-net]
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: thor-kafka-ui
    restart: unless-stopped
    depends_on: [kafka]
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: thor-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks: [thor-net]

# ─────────────────────────────────────────────────────────────────────────────
# OBSERVABILITY — Grafana Tempo (distributed tracing)
# Real: https://github.com/grafana/tempo
# ─────────────────────────────────────────────────────────────────────────────

  tempo:
    image: grafana/tempo:2.6.0
    container_name: thor-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"    # Tempo HTTP
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "9411:9411"    # Zipkin
      - "14268:14268"  # Jaeger HTTP thrift
    volumes:
      - ./monitoring/tempo/tempo-config.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/tmp/tempo
    networks: [thor-obs-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

# ─────────────────────────────────────────────────────────────────────────────
# THREAT INTEL — OpenCTI Platform
# Real: https://github.com/OpenCTI-Platform/opencti
# ─────────────────────────────────────────────────────────────────────────────

  opencti:
    image: opencti/platform:6.3.7
    container_name: thor-opencti
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      - opencti-db
      - redis
      - minio
      - rabbitmq
    ports:
      - "8080:8080"
    environment:
      NODE_OPTIONS: "--max-old-space-size=8096"
      APP__PORT: 8080
      APP__BASE_URL: "http://localhost:8080"
      APP__ADMIN__EMAIL: "${OPENCTI_ADMIN_EMAIL:-admin@thor.io}"
      APP__ADMIN__PASSWORD: "${OPENCTI_ADMIN_PASSWORD:-thor_opencti_admin}"
      APP__ADMIN__TOKEN: "${OPENCTI_ADMIN_TOKEN:-thor_api_token_placeholder}"
      REDIS__HOSTNAME: redis
      REDIS__PORT: 6379
      ELASTICSEARCH__URL: http://elasticsearch:9200
      MINIO__ENDPOINT: minio
      MINIO__PORT: 9000
      MINIO__USE_SSL: "false"
      MINIO__ACCESS_KEY: "${MINIO_ACCESS_KEY:-thor_minio_key}"
      MINIO__SECRET_KEY: "${MINIO_SECRET_KEY:-thor_minio_secret}"
      RABBITMQ__HOSTNAME: rabbitmq
      RABBITMQ__PORT: 5672
      RABBITMQ__USERNAME: "${RABBITMQ_USER:-thor}"
      RABBITMQ__PASSWORD: "${RABBITMQ_PASS:-thor_rmq}"
      SMTP__HOSTNAME: localhost
      PROVIDERS__LOCAL__STRATEGY: LocalStrategy
    volumes:
      - opencti_data:/opt/opencti-data
    networks: [thor-net]

  opencti-db:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: thor-opencti-es
    profiles: ["full"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    volumes:
      - opencti_es_data:/usr/share/elasticsearch/data
    networks: [thor-net]

  minio:
    image: minio/minio:RELEASE.2024-01-13T07-53-03Z
    container_name: thor-minio
    profiles: ["full"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-thor_minio_key}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-thor_minio_secret}"
    volumes:
      - minio_data:/data
    networks: [thor-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: thor-rabbitmq
    profiles: ["full"]
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-thor}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:-thor_rmq}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [thor-net]

# ─────────────────────────────────────────────────────────────────────────────
# INCIDENT RESPONSE — TheHive
# Real: https://github.com/TheHive-Project/TheHive
# ─────────────────────────────────────────────────────────────────────────────

  thehive:
    image: thehiveproject/thehive:5.3
    container_name: thor-thehive
    profiles: ["full"]
    depends_on: [opencti-db]
    ports:
      - "9000:9000"
    environment:
      TH_SECRET: "${THEHIVE_SECRET:-thor_thehive_secret_change_me}"
      TH_DB_HOST: thehive-db
      TH_DB_PORT: 5432
      TH_DB_NAME: thehive
      TH_DB_USER: thehive
      TH_DB_PASSWORD: "${THEHIVE_DB_PASSWORD:-thehive_pass}"
    networks: [thor-net]
    volumes:
      - thehive_data:/opt/thehive/data

  thehive-db:
    image: postgres:16-alpine
    container_name: thor-thehive-db
    profiles: ["full"]
    environment:
      POSTGRES_DB: thehive
      POSTGRES_USER: thehive
      POSTGRES_PASSWORD: "${THEHIVE_DB_PASSWORD:-thehive_pass}"
    volumes:
      - thehive_db_data:/var/lib/postgresql/data
    networks: [thor-net]

# ─────────────────────────────────────────────────────────────────────────────
# ENDPOINT SECURITY — Wazuh SIEM/XDR
# Real: https://github.com/wazuh/wazuh
# ─────────────────────────────────────────────────────────────────────────────

  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.0
    container_name: thor-wazuh
    profiles: ["endpoint"]
    ports:
      - "1514:1514"   # Agent connections
      - "1515:1515"   # Agent enrollment
      - "514:514/udp" # Syslog
      - "55000:55000" # REST API
    environment:
      WAZUH_API_USERNAME: wazuh-wui
      WAZUH_API_PASSWORD: "${WAZUH_API_PASSWORD:-MyS3cr37P450r.*-}"
    volumes:
      - wazuh_data:/var/ossec/data
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
    networks: [thor-net]
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep 'wazuh-execd' | grep -q running"]
      interval: 30s
      timeout: 10s
      retries: 5

