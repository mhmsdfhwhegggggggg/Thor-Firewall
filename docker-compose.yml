# Thor Firewall — Docker Compose (Development + Local Testing)
# الاستخدام: make dev  أو  docker compose up -d

version: "3.9"

networks:
  thor-net:
    driver: bridge

volumes:
  clickhouse_data:
  redis_data:
  mlflow_data:
  ml_models:
  grafana_data:
  prometheus_data:

services:

  # ── ClickHouse (Event Storage + Analytics) ─────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: thor-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./configs/clickhouse:/docker-entrypoint-initdb.d
    environment:
      CLICKHOUSE_DB: thor
      CLICKHOUSE_USER: thor
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-thor_dev_password}"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - thor-net

  # ── Redis (Cache + Message Queue) ──────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: thor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - thor-net

  # ── MLflow (Experiment Tracking) ────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:2.11.0
    container_name: thor-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
      - ml_models:/models
    environment:
      MLFLOW_BACKEND_STORE_URI: "sqlite:////mlflow/mlflow.db"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: "file:///mlflow/artifacts"
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0 --port 5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - thor-net

  # ── ML Inference Server ─────────────────────────────────────────────────────
  ml-inference:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: thor-ml-inference
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - ml_models:/models
    environment:
      MODEL_PATH: /models/thor_marl_best.pt
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DEVICE: cpu
      BATCH_SIZE: "256"
      PORT: "8082"
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - thor-net

  # ── Control Plane (API Server) ───────────────────────────────────────────────
  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    container_name: thor-control-plane
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CLICKHOUSE_URL: "clickhouse://thor:${CLICKHOUSE_PASSWORD:-thor_dev_password}@clickhouse:9000/thor"
      REDIS_URL: "redis://redis:6379/0"
      ML_INFERENCE_URL: "http://ml-inference:8082"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      JWT_SECRET: "${JWT_SECRET:-dev_secret_change_in_prod}"
      AUDIT_HMAC_SECRET: "${AUDIT_HMAC_SECRET:-hmac_dev_change_in_prod_32b!!}"
      ENVIRONMENT: "development"
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - thor-net

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: thor-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus:/etc/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - thor-net

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.1
    container_name: thor-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning/datasources
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    networks:
      - thor-net

  # ── Dashboard (React Dev Server) ─────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    container_name: thor-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard/src:/app/src
    environment:
      VITE_API_URL: "http://localhost:8000"
      PORT: "3000"
    depends_on:
      - control-plane
    networks:
      - thor-net
