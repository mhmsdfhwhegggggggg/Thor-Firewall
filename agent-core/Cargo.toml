[package]
name = "thor-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
# الشبكات والباكت
pcap = "1.0"
libc = "0.2"
socket2 = "0.5"

# eBPF (Linux)
aya = "0.12"
aya-log = "0.12"

# ويندوز WFP عبر FFI
winapi = { version = "0.3", features = ["ws2ipdef", "windowsfilteringplatform"]}
windows = "0.54"

# الذكاء الاصطناعي
tch = "0.12"   # PyTorch binding للـ RL
candle-core = "0.4"  # بديل خفيف للـ LLM

# معالجة البيانات
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = "0.4"

# السجلات والمراقبة
log = "0.4"
env_logger = "0.10"

[target.'cfg(target_os="linux")'.dependencies]
aya = "0.12"

[target.'cfg(target_os="windows")'.dependencies]
winapi = "0.3"
