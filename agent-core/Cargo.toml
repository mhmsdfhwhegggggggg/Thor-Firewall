[package]
name = "thor-agent"
version = "0.2.0"
edition = "2021"

[dependencies]
# ── شبكات وباكت ─────────────────────────────────────────────
pcap     = "1.0"
libc     = "0.2"
socket2  = "0.5"

# ── eBPF (Linux only) ────────────────────────────────────────
aya      = { version = "0.12", optional = true }
aya-log  = { version = "0.12", optional = true }

# ── Wazuh Integration (مدمج بالكامل) ─────────────────────────
wazuh-client = "0.1.8"

# ── الذكاء الاصطناعي ─────────────────────────────────────────
candle-core  = { version = "0.4", optional = true }

# ── HTTP Client (مشترك بين wazuh + inference + llm) ──────────
reqwest  = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# ── Serialisation ─────────────────────────────────────────────
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"

# ── Async runtime ─────────────────────────────────────────────
tokio    = { version = "1.0", features = ["full"] }

# ── وقت وتوثيق ───────────────────────────────────────────────
chrono   = { version = "0.4", features = ["serde"] }
uuid     = { version = "1.0", features = ["v4", "serde"] }

# ── سجلات ────────────────────────────────────────────────────
log          = "0.4"
env_logger   = "0.11"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── أدوات مساعدة ──────────────────────────────────────────────
thiserror    = "2.0"
urlencoding  = "2.1"
tempfile     = "3.0"

[features]
default = []
ebpf    = ["aya", "aya-log"]
ml      = ["candle-core"]
full    = ["ebpf", "ml"]

[target.'cfg(target_os = "linux")'.dependencies]
aya     = { version = "0.12", optional = true }
aya-log = { version = "0.12", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
winapi  = { version = "0.3", features = ["ws2ipdef", "windowsfilteringplatform"], optional = true }

[[bin]]
name = "thor-agent"
path = "src/main.rs"
