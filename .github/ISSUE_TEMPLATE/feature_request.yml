name: "✨ Feature Request"
description: "Suggest a new feature or improvement"
title: "[FEATURE] "
labels: ["enhancement", "needs-discussion"]

body:
  - type: markdown
    attributes:
      value: |
        ## ✨ Thor Firewall Feature Request
        We welcome all ideas. Please describe your feature clearly.

  - type: dropdown
    id: phase
    attributes:
      label: Relevant Roadmap Phase
      options:
        - Phase 0 - Infrastructure
        - Phase 1 - eBPF/WFP Core
        - Phase 2 - AI/ML Engine
        - Phase 3 - Self-Protection
        - Phase 4 - Dashboard
        - Phase 5 - Testing
        - Phase 6 - Commercial
        - New Phase / Not in Roadmap
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution in detail
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Critical (Security vulnerability or data loss)
        - High (Core functionality affected)
        - Medium (Useful improvement)
        - Low (Nice to have)
    validations:
      required: true
