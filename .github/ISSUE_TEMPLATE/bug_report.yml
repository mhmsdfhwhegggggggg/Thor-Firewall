name: "🐛 Bug Report"
description: "Report a bug in Thor Firewall"
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Thor Firewall Bug Report
        Thank you for reporting a bug. Please fill in as much detail as possible.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of Thor Firewall is affected?
      options:
        - eBPF/XDP Kernel Module (Linux)
        - WFP Driver (Windows)
        - Rust Agent (Core)
        - MARL Engine
        - GNN Analyzer
        - LLM Explainer
        - Control Plane (FastAPI)
        - Dashboard (React)
        - CI/CD Pipeline
        - Documentation
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux (Ubuntu 22.04)
        - Linux (Ubuntu 24.04)
        - Linux (Other - specify below)
        - Windows 11
        - Windows Server 2022
        - Windows Server 2025
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel Version (Linux only)
      placeholder: "uname -r output, e.g., 6.8.0-39-generic"

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear description of what went wrong
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run thor-agent with config...
        2. Send traffic to interface...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Agent Logs
      description: Paste relevant logs (remove sensitive IPs if needed)
      render: text

  - type: input
    id: version
    attributes:
      label: Thor Firewall Version
      placeholder: "v0.1.0 or git commit SHA"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing issues
          required: true
        - label: I have included logs and relevant information
          required: true
        - label: I have removed any sensitive data from logs
          required: true
