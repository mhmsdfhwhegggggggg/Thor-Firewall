# Thor Firewall — Full CI/CD Pipeline
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/mhmsdfhwhegggggggg

jobs:
  # ── Rust Agent Tests ─────────────────────────────────────────────────────────
  test-rust:
    name: Rust Agent Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./agent -> target"
      - name: Clippy
        working-directory: agent
        run: cargo clippy -- -D warnings
      - name: Tests
        working-directory: agent
        run: cargo test --release
      - name: Security Audit
        run: |
          cargo install cargo-audit
          cd agent && cargo audit

  # ── Python Control Plane Tests ───────────────────────────────────────────────
  test-python:
    name: Python Control Plane Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r control-plane/requirements.txt pytest pytest-asyncio
      - name: Tests
        run: pytest control-plane/tests/ -v --tb=short
        continue-on-error: true
      - name: Ruff
        run: |
          pip install ruff
          ruff check control-plane/src/ ml/ --select E,W,F

  # ── ML Tests ─────────────────────────────────────────────────────────────────
  test-ml:
    name: ML Pipeline Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ML deps
        run: pip install -r ml/requirements.txt pytest
      - name: Test UEBA
        run: python -c "from ml.ueba.anomaly_detector import UEBAAnomalyEngine; import numpy as np; e=UEBAAnomalyEngine(); e.train(np.random.randn(100,8)); print('UEBA OK')"
      - name: Test GNN
        run: python -c "from ml.training.train_gnn import ThorGNN; import torch; m=ThorGNN(); print('GNN OK')"

  # ── Dashboard Build ───────────────────────────────────────────────────────────
  build-dashboard:
    name: Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        working-directory: dashboard
        run: npm ci
      - name: TypeCheck
        working-directory: dashboard
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Build
        working-directory: dashboard
        run: npm run build

  # ── Docker Build & Push ───────────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test-rust, test-python, build-dashboard]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build & Push Control Plane
        uses: docker/build-push-action@v5
        with:
          context: control-plane
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/thor-control-plane:${{ github.sha }},${{ env.IMAGE_PREFIX }}/thor-control-plane:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & Push ML Inference
        uses: docker/build-push-action@v5
        with:
          context: ml
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/thor-ml-inference:${{ github.sha }},${{ env.IMAGE_PREFIX }}/thor-ml-inference:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Helm Deploy to Staging ────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm Lint
        run: helm lint helm/thor-firewall
      - name: Update Image Tags
        run: |
          sed -i "s/tag: .*/tag: ${{ github.sha }}/" helm/thor-firewall/values.yaml
      - name: ArgoCD Sync
        run: |
          echo "ArgoCD auto-syncs via GitOps — image tag updated in values.yaml"
          echo "ArgoCD will detect the change and deploy to staging"
