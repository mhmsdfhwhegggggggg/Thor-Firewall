name: Thor Firewall CI/CD Pipeline

on:
  push:
    branches: [main, develop, "release/*", "hotfix/*"]
  pull_request:
    branches: [main, develop]
  schedule:
    # تشغيل يومي للفحص الأمني
    - cron: "0 2 * * *"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: info

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================================
jobs:
# ============================================================================

  # ──────────────────────────────────────────────────────────────────────────
  # 1. Code Quality & Security
  # ──────────────────────────────────────────────────────────────────────────
  quality:
    name: "Code Quality & Security Scan"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust Clippy (deny warnings)
        run: |
          cargo clippy --all-targets --all-features -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic

      - name: Python format & lint
        run: |
          pip install ruff black mypy
          ruff check ml/ control-plane/
          black --check ml/ control-plane/
          mypy ml/ --ignore-missing-imports --strict

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          languages: rust, python
          config-file: .github/codeql/codeql-config.yml

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Rust Tests (Agent + Core)
  # ──────────────────────────────────────────────────────────────────────────
  test-rust:
    name: "Rust Tests — ${{ matrix.os }}"
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        rust: [stable, "1.79"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install eBPF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang llvm libbpf-dev \
            linux-headers-$(uname -r) \
            libssl-dev pkg-config

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: |
          cargo test --all --all-features -- --test-threads=4

      - name: Run integration tests
        run: |
          cargo test --test '*' --all-features

      - name: Generate test coverage
        if: matrix.os == 'ubuntu-24.04' && matrix.rust == 'stable'
        run: |
          cargo install cargo-tarpaulin --quiet
          cargo tarpaulin --all --all-features \
            --out Xml --output-dir coverage/ \
            --timeout 120

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-24.04' && matrix.rust == 'stable'
        uses: codecov/codecov-action@v7
        with:
          files: coverage/cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Python Tests (ML Components)
  # ──────────────────────────────────────────────────────────────────────────
  test-python:
    name: "Python Tests — ML Components"
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r ml/requirements.txt pytest pytest-asyncio pytest-cov

      - name: Run ML unit tests
        run: |
          pytest ml/tests/ control-plane/tests/ \
            --cov=ml --cov=control-plane \
            --cov-report=xml \
            -v --timeout=60

      - name: Upload Python coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: python

  # ──────────────────────────────────────────────────────────────────────────
  # 4. eBPF Program Build & Verify
  # ──────────────────────────────────────────────────────────────────────────
  build-ebpf:
    name: "Build & Verify eBPF Programs"
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install eBPF build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang llvm libbpf-dev bpftool \
            linux-headers-$(uname -r)

      - name: Generate vmlinux.h
        run: |
          bpftool btf dump file /sys/kernel/btf/vmlinux format c \
            > kernel-modules/linux/ebpf/headers/vmlinux.h
        continue-on-error: true  # قد يفشل في بعض بيئات CI

      - name: Build eBPF programs
        run: |
          cd kernel-modules/linux/ebpf
          make all
        continue-on-error: true

      - name: Upload eBPF objects
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-programs
          path: kernel-modules/linux/ebpf/*.o
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  # 5. Performance Benchmarks
  # ──────────────────────────────────────────────────────────────────────────
  benchmark:
    name: "Performance Benchmarks"
    needs: [test-rust, test-python]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: |
          cargo bench --all -- --output-format bencher | \
            tee benchmark-results.txt

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: benchmark-results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "120%"
          comment-on-alert: true
          fail-on-alert: true

  # ──────────────────────────────────────────────────────────────────────────
  # 6. Build Docker Images
  # ──────────────────────────────────────────────────────────────────────────
  build-docker:
    name: "Build & Push Docker Images"
    needs: [test-rust, test-python, build-ebpf]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/thor-agent
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=git-

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.agent
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ──────────────────────────────────────────────────────────────────────────
  # 7. Security Audit
  # ──────────────────────────────────────────────────────────────────────────
  security-audit:
    name: "Security Audit"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust security audit
        uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python safety check
        run: |
          pip install safety pip-audit
          pip-audit -r ml/requirements.txt --format json | tee pip-audit.json

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # 8. Deploy ML Models to Hugging Face
  # ──────────────────────────────────────────────────────────────────────────
  deploy-models:
    name: "Deploy ML Models to HuggingFace"
    needs: [test-python]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Push models to HuggingFace Hub
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          pip install huggingface_hub
          python scripts/ci/push_models_to_hf.py
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────────────
  # Summary
  # ──────────────────────────────────────────────────────────────────────────
  ci-summary:
    name: "CI Summary"
    needs: [quality, test-rust, test-python, build-ebpf, security-audit]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.quality.result }}" != "success" || \
                "${{ needs.test-rust.result }}" != "success" || \
                "${{ needs.test-python.result }}" != "success" || \
                "${{ needs.security-audit.result }}" != "success" ]]; then
            echo "❌ One or more required jobs failed"
            exit 1
          fi
          echo "✅ All required CI checks passed"
