# Thor Firewall — CI/CD Pipeline
name: Thor Firewall CI/CD

on:
  push:
    branches: [main, develop, "release/*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/mhmsdfhwhegggggggg

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust Agent ──────────────────────────────────────────────────────────────
  build-agent:
    name: Build & Test Rust Agent
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install eBPF deps
        run: |
          sudo apt-get install -y libbpf-dev libelf-dev linux-headers-$(uname -r) clang llvm

      - name: Lint (clippy)
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace --release

      - name: Build release binary
        run: cargo build --workspace --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thor-agent-linux-x86_64
          path: target/release/thor-agent
          retention-days: 7

  # ── Python Control Plane ────────────────────────────────────────────────────
  build-control-plane:
    name: Test Python Control Plane
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          cd control-plane
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: cd control-plane && ruff check src/

      - name: Type check (mypy)
        run: cd control-plane && mypy src/ --ignore-missing-imports

      - name: Run tests
        run: cd control-plane && pytest tests/ -v --cov=src --cov-report=xml

  # ── ML Models ──────────────────────────────────────────────────────────────
  test-ml:
    name: Test ML Pipeline
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ML deps
        run: |
          cd ml
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Test data pipeline (synthetic)
        run: cd ml && python data/preprocess.py --synthetic --data-dir /tmp/raw --output-dir /tmp/processed

      - name: Test inference server startup
        run: |
          cd ml && python serving/inference_server.py &
          sleep 3
          curl -f http://localhost:8082/health || exit 1
          kill %1

  # ── Dashboard ──────────────────────────────────────────────────────────────
  build-dashboard:
    name: Build React Dashboard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install deps
        run: cd dashboard && npm ci

      - name: Type check
        run: cd dashboard && npx tsc --noEmit

      - name: Lint
        run: cd dashboard && npm run lint

      - name: Build
        run: cd dashboard && npm run build

  # ── Security Scans ─────────────────────────────────────────────────────────
  security:
    name: Security Scans
    runs-on: ubuntu-22.04
    needs: [build-agent, build-control-plane]
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy (SAST)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ── Docker Images ──────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-22.04
    needs: [build-agent, build-control-plane, build-dashboard, security]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [agent, control-plane, ml-inference, dashboard]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/thor-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=git-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'ml-inference' && 'ml' || matrix.service }}
          file: ${{ matrix.service == 'ml-inference' && 'ml/Dockerfile' || format('{0}/Dockerfile', matrix.service) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ── Deploy to Staging ──────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-22.04
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://thor-staging.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Trigger ArgoCD sync (staging)
        run: |
          curl -s -X POST "${{ secrets.ARGOCD_URL }}/api/v1/applications/thor-firewall-staging/sync" \
            -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"revision": "${{ github.sha }}", "prune": true, "dryRun": false}'
