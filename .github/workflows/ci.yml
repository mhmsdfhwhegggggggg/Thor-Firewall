# Thor Firewall — CI/CD Pipeline
# يُشغَّل على كل push/PR

name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # ── Rust Agent ─────────────────────────────────────────────────────────────
  test-rust:
    name: Rust Agent Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: bpfel-unknown-none
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "agent -> target" }
      - name: Clippy
        run: cargo clippy --manifest-path agent/Cargo.toml -- -D warnings
      - name: Rustfmt
        run: cargo fmt --manifest-path agent/Cargo.toml --check
      - name: Tests
        run: cargo test --manifest-path agent/Cargo.toml

  # ── Python Control Plane ───────────────────────────────────────────────────
  test-python:
    name: Python Control Plane Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        run: |
          pip install uv
          uv pip install --system -r control-plane/requirements.txt
          uv pip install --system pytest pytest-asyncio pytest-cov httpx
      - name: Ruff lint
        run: |
          pip install ruff
          ruff check control-plane/src/
      - name: Type check
        run: |
          pip install mypy
          mypy control-plane/src/ --ignore-missing-imports
      - name: Tests
        run: pytest control-plane/tests/ -v --cov=src --cov-report=xml
      - uses: codecov/codecov-action@v4
        with: { files: coverage.xml }

  # ── Dashboard ──────────────────────────────────────────────────────────────
  test-dashboard:
    name: Dashboard Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd dashboard && npm ci --frozen-lockfile
      - run: cd dashboard && npm run typecheck
      - run: cd dashboard && npm run lint
      - run: cd dashboard && npm run build

  # ── Security Scans ────────────────────────────────────────────────────────
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: [test-rust, test-python, test-dashboard]
    steps:
      - uses: actions/checkout@v4
      # Python dependency vulnerabilities
      - name: Safety check
        run: pip install safety && safety check -r control-plane/requirements.txt
      # Container scan
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
      # Secret scan
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}

  # ── Build & Push Images ────────────────────────────────────────────────────
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/thor-control-plane
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - name: Build & Push
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ env.OWNER }}
          TAG: ${{ steps.meta.outputs.version }}
          PUSH: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-and-push.sh --tag $TAG --push

  # ── Deploy to Staging ──────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-push]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.16.0 }
      - name: Configure kubectl
        run: echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > ~/.kube/config
      - name: Deploy
        run: |
          NAMESPACE=thor-staging TAG=${{ github.sha }} ./scripts/deploy-prod.sh
      - name: Integration tests
        run: |
          kubectl run test --rm -i --restart=Never \
            --image=curlimages/curl:latest \
            -n thor-staging -- \
            curl -sf http://thor-control-plane:8000/api/health

  # ── Deploy to Production ───────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://thor.yourdomain.com
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.16.0 }
      - name: Configure kubectl
        run: echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config
      - name: Deploy
        run: |
          TAG=${{ github.ref_name }} ./scripts/deploy-prod.sh
      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: "Thor Firewall ${{ github.ref_name }} deployed to production"
          SLACK_COLOR: ${{ job.status }}
