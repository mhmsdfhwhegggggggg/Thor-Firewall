name: Build Linux Agent

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
    - name: Install eBPF dependencies
      run: sudo apt-get install -y clang llvm libbpf-dev
    - name: Build eBPF module
      run: make -C kernel-modules/linux/ebpf/
    - name: Build Rust agent
      run: cargo build --verbose
    - name: Run unit tests
      run: cargo test
