name: Security & Threat Detection

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 */6 * * *"  # كل 6 ساعات
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust cargo-audit
        run: |
          cargo install cargo-audit --quiet
          cargo audit --json | tee rust-audit.json

      - name: Python pip-audit
        run: |
          pip install pip-audit
          pip-audit -r ml/requirements.txt --format json | tee python-audit.json

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: |
            rust-audit.json
            python-audit.json

  codeql:
    name: CodeQL Static Analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    strategy:
      matrix:
        language: [python, c-cpp]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: Container Image Scanning
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build agent image for scanning
        run: docker build -f docker/Dockerfile.agent -t thor-agent:scan .
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: thor-agent:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
