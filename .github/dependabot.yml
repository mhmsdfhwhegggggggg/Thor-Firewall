version: 2

updates:
  # Rust / Cargo
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # تجنب تحديثات major التي قد تكسر API
      - dependency-name: "tokio"
        update-types: ["version-update:semver-major"]
      - dependency-name: "aya"
        update-types: ["version-update:semver-major"]

  # Python / pip
  - package-ecosystem: pip
    directory: "/ml"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # torch تحديثات حساسة
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Riyadh"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
