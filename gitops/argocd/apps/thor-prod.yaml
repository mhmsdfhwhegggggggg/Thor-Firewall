# Thor Firewall — ArgoCD Production Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thor-firewall-production
  namespace: argocd
  labels:
    app.kubernetes.io/name: thor-firewall
    environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: thor-deployments
    notifications.argoproj.io/subscribe.on-sync-failed.slack: thor-alerts
spec:
  project: thor-project
  source:
    repoURL: https://github.com/mhmsdfhwhegggggggg/Thor-Firewall.git
    targetRevision: main
    path: helm/thor-firewall
    helm:
      releaseName: thor
      valueFiles:
        - values.yaml
        - values.production.yaml
      values: |
        global:
          imageTag: "1.0.0"
        controlPlane:
          replicas: 3
          autoscaling:
            enabled: true
            minReplicas: 3
            maxReplicas: 20
  destination:
    server: https://kubernetes.default.svc
    namespace: thor-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
